name: Promote development to staging
run-name: Promote development to staging

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    name: Promote development to staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout staging
        run: git checkout staging

      - name: Merge development
        run: 'git merge --no-ff origin/development -m "chore: merge development to staging [ci-skip]"'

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check GuestHub pilot env example
        run: npm run ops:guesthub-pilot:check-env

      - name: Push staging
        if: success()
        run: git push origin staging

      - name: Notify
        if: success()
        run: echo "✓ Successfully promoted development to staging"

      - name: Notify failure
        if: failure()
        run: |
          echo "✗ Promotion failed"
          echo "Merge may have conflicts. Resolve manually."
        continue-on-error: true
