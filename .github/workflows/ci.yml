name: CI

on:
  pull_request:
    branches:
      - development
      - staging
      - production
  push:
    branches:
      - main
      - development
      - staging
      - production

jobs:
  validate:
    name: Validate Nexus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check SyncXML pilot env example
        run: npm run ops:syncxml-pilot:check-env
