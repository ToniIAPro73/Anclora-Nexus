name: CI

on:
  pull_request:
    branches:
      - development
      - staging
      - production
  push:
    branches:
      - main
      - development
      - staging
      - production

jobs:
  validate:
    name: Validate Nexus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test frontend
        run: npm test -w frontend

      - name: Build
        run: npm run build

      - name: Check GuestHub pilot env example
        run: npm run ops:guesthub-pilot:check-env

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio hypothesis python-dateutil

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
